<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 Creator - Neural Expressive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: rgba(13, 25, 48, 0.7);
            --neon-blue: #00f0ff;
            --neural-cyan: #00ea91;
            --text-primary: #f0f5ff;
            --text-secondary: #7e8fa9;
            --border-glow: rgba(0, 240, 255, 0.2);
            --shadow-neural: 0 8px 32px 0 rgba(0, 240, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #102542 0%, var(--bg-main) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            background: rgba(6, 11, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--border-glow);
            padding: 15px 30px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left .title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-center {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .stream-link-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--neon-blue);
            padding: 10px 20px;
            border-radius: 30px;
            color: var(--neural-cyan);
            font-family: monospace;
            font-size: 0.95rem;
            min-width: 300px;
            text-align: center;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(-10px);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .stream-link-box.active {
            opacity: 1;
            transform: translateY(0);
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
        }

        .btn-neural {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            background-size: 200% auto;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(67, 100, 247, 0.4);
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-neural:hover {
            background-position: right center;
            box-shadow: 0 0 25px var(--neon-blue);
            transform: scale(1.02);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-neural);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 240, 255, 0.3);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            color: var(--neon-blue);
            border-left: 4px solid var(--neural-cyan);
            padding-left: 10px;
            text-transform: uppercase;
        }

        .section-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- CONTROL ELEMENT STYLES --- */
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-top: 12px;
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Custom File Upload Button */
        input[type="file"]::file-selector-button {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--neon-blue);
            color: black;
        }

        /* Grid Layout cho Chọn vị trí */
        .position-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* --- PREVIEW MONITOR (Mô phỏng Luồng Phát) --- */
        .preview-monitor {
            margin-top: 20px;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .preview-video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }

        .preview-video-placeholder i {
            font-size: 3rem;
            margin-bottom: 10px;
            color: rgba(0, 240, 255, 0.3);
        }

        /* Các thành phần lớp phủ Live (Overlay) */
        .overlay-logo {
            position: absolute;
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            display: none;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .overlay-clock {
            position: absolute;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,240,255,0.5);
            transition: all 0.3s ease;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Class định vị động cho Overlay */
        .pos-top-left { top: 15px; left: 15px; bottom: auto; right: auto; }
        .pos-top-right { top: 15px; right: 15px; bottom: auto; left: auto; }
        .pos-bottom-left { bottom: 15px; left: 15px; top: auto; right: auto; }
        .pos-bottom-right { bottom: 15px; right: 15px; top: auto; left: auto; }

        .btn-apply {
            background: linear-gradient(135deg, #00ea91, #00bfa5);
            color: #050b14;
            font-weight: 700;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 234, 145, 0.3);
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-apply:hover {
            box-shadow: 0 0 25px var(--neural-cyan);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="title"><i class="fa-solid fa-network-wired"></i> M3U8 Creator</div>
        </div>
        <div class="header-center">
            <div class="stream-link-box" id="streamLinkBox">
                <i class="fa-solid fa-link"></i> <span id="streamLinkText">Chưa có luồng phát</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-neural" id="btnStartStream">
                <i class="fa-solid fa-play"></i> Bắt đầu luồng stream
            </button>
        </div>
    </header>

    <div class="container">
        
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> Cấu hình nguồn phát</h2>
            
            <div class="section-group">
                <h3><i class="fa-solid fa-file-video"></i> Phương thức 1: Upload Video</h3>
                <label for="videoUpload">Chọn tệp tin video (mp4, mov, avi, mkv...):</label>
                <input type="file" id="videoUpload" accept="video/*">
            </div>

            <div class="section-group">
                <h3><i class="fa-solid fa-satellite-dish"></i> Phương thức 2: Tiếp sóng URL M3U8</h3>
                <label for="m3u8Url">Nhập link nguồn M3U8 hợp lệ:</label>
                <input type="text" id="m3u8Url" placeholder="https://example.com/live/stream.m3u8">
            </div>

            <label>Màn hình giám sát (Live Preview):</label>
            <div class="preview-monitor" id="previewMonitor">
                <img id="overlayLogo" class="overlay-logo pos-top-left" src="" alt="Logo">
                <div id="overlayClock" class="overlay-clock pos-top-right">00:00</div>

                <div class="preview-video-placeholder" id="videoPlaceholder">
                    <i class="fa-solid fa-circle-notch fa-spin" id="loadingIcon" style="display:none;"></i>
                    <i class="fa-solid fa-tv" id="tvIcon"></i>
                    <span id="monitorStatus">Tín hiệu trống - Vui lòng chọn nguồn và bấm Bắt đầu</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Cá nhân hóa luồng stream</h2>
            
            <div class="section-group">
                <h3><i class="fa-solid fa-image"></i> Logo Luồng</h3>
                <label for="logoUpload">Tải ảnh Logo lên:</label>
                <input type="file" id="logoUpload" accept="image/*">
                
                <label for="logoPosition">Vị trí hiển thị logo:</label>
                <select id="logoPosition">
                    <option value="pos-top-left">Góc trên - bên Trái</option>
                    <option value="pos-top-right">Góc trên - bên Phải</option>
                    <option value="pos-bottom-left">Góc dưới - bên Trái</option>
                    <option value="pos-bottom-right">Góc dưới - bên Phải</option>
                </select>
            </div>

            <div class="section-group">
                <h3><i class="fa-solid fa-clock"></i> Đồng hồ hiển thị</h3>
                <div class="position-grid">
                    <div>
                        <label for="clockPosition">Vị trí đồng hồ:</label>
                        <select id="clockPosition">
                            <option value="pos-top-right" selected>Góc trên - bên Phải</option>
                            <option value="pos-top-left">Góc trên - bên Trái</option>
                            <option value="pos-bottom-left">Góc dưới - bên Trái</option>
                            <option value="pos-bottom-right">Góc dưới - bên Phải</option>
                        </select>
                    </div>
                    <div>
                        <label for="clockFamily">Font-family chữ:</label>
                        <input type="text" id="clockFamily" value="Orbitron" placeholder="Ví dụ: 'Arial', sans-serif">
                    </div>
                </div>

                <label for="clockStyleSheet">Link Stylesheet tùy biến (Google Fonts URL nếu có):</label>
                <input type="text" id="clockStyleSheet" placeholder="https://fonts.googleapis.com/css2?family=Tên+Font">
            </div>

            <button class="btn-apply" id="btnApplyCustom">
                <i class="fa-solid fa-check-double"></i> Áp dụng cài đặt cá nhân hóa
            </button>
        </div>

    </div>

    <script>
        // DOM Elements
        const btnStartStream = document.getElementById('btnStartStream');
        const streamLinkBox = document.getElementById('streamLinkBox');
        const streamLinkText = document.getElementById('streamLinkText');
        
        const videoUpload = document.getElementById('videoUpload');
        const m3u8Url = document.getElementById('m3u8Url');
        
        const tvIcon = document.getElementById('tvIcon');
        const loadingIcon = document.getElementById('loadingIcon');
        const monitorStatus = document.getElementById('monitorStatus');
        
        const logoUpload = document.getElementById('logoUpload');
        const logoPosition = document.getElementById('logoPosition');
        const clockPosition = document.getElementById('clockPosition');
        const clockFamily = document.getElementById('clockFamily');
        const clockStyleSheet = document.getElementById('clockStyleSheet');
        
        const overlayLogo = document.getElementById('overlayLogo');
        const overlayClock = document.getElementById('overlayClock');
        const btnApplyCustom = document.getElementById('btnApplyCustom');

        // Khởi động cập nhật đồng hồ chạy thực tế (Giả lập thời gian thực trên luồng)
        function updateLiveClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            overlayClock.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // Xử lý sự kiện: Bắt đầu luồng stream
        btnStartStream.addEventListener('click', () => {
            let streamSource = "";
            
            if (videoUpload.files.length > 0) {
                streamSource = `Tệp cục bộ: ${videoUpload.files[0].name}`;
            } else if (m3u8Url.value.trim() !== "") {
                streamSource = m3u8Url.value.trim();
            } else {
                alert("Vui lòng tải video lên hoặc nhập link URL tiếp sóng trước khi bắt đầu!");
                return;
            }

            // Tạo mã hash ngẫu nhiên cho link stream m3u8
            const randomCode = Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 6);
            const currentDomain = window.location.origin === "null" ? "https://neural-stream.io" : window.location.origin;
            const generatedM3u8 = `${currentDomain}/hls/${randomCode}.m3u8`;

            // Hiển thị hiệu ứng loading nhẹ trên màn hình monitor
            tvIcon.style.display = 'none';
            loadingIcon.style.display = 'block';
            monitorStatus.textContent = "Đang mã hóa luồng tín hiệu...";

            setTimeout(() => {
                loadingIcon.style.display = 'none';
                tvIcon.style.display = 'block';
                tvIcon.className = "fa-solid fa-signal";
                tvIcon.style.color = "var(--neural-cyan)";
                monitorStatus.textContent = `Đang phát trực tuyến luồng của bạn.`;
                
                // Cập nhật link luồng ở giữa header
                streamLinkText.textContent = generatedM3u8;
                streamLinkBox.classList.add('active');
            }, 1200);
        });

        // Xử lý sự kiện: Áp dụng cá nhân hóa (Logo & Đồng hồ)
        btnApplyCustom.addEventListener('click', () => {
            // 1. Cập nhật Logo
            if (logoUpload.files && logoUpload.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    overlayLogo.src = e.target.result;
                    overlayLogo.style.display = 'block';
                }
                reader.readAsDataURL(logoUpload.files[0]);
            }

            // Cập nhật Vị trí Logo
            overlayLogo.className = `overlay-logo ${logoPosition.value}`;

            // 2. Cập nhật Vị trí Đồng hồ
            overlayClock.className = `overlay-clock ${clockPosition.value}`;

            // 3. Tải Font tùy biến (nếu có link stylesheet)
            if (clockStyleSheet.value.trim() !== "") {
                const linkId = "dynamic-clock-font";
                let oldLink = document.getElementById(linkId);
                if (oldLink) oldLink.remove();

                const newLink = document.createElement('link');
                newLink.id = linkId;
                newLink.rel = 'stylesheet';
                newLink.href = clockStyleSheet.value.trim();
                document.head.appendChild(newLink);
            }

            // Thay đổi font-family của đồng hồ hiển thị
            if (clockFamily.value.trim() !== "") {
                overlayClock.style.fontFamily = clockFamily.value;
            }

            alert("Đã đồng bộ hóa thiết lập cá nhân hóa lên luồng phát!");
        });
    </script>
</body>
</html>
